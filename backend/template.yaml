AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Reply Open Day - AI Customer Support Ticket Assistant backend

Parameters:
  BedrockModelId:
    Type: String
    Default: eu.anthropic.claude-haiku-4-5-20251001-v1:0
  DemoMode:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: python3.12
    Architectures: [x86_64]

Resources:
  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: openday-backend-deps
      ContentUri: layer/
      CompatibleRuntimes: [python3.12]
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.12

  BackendExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: openday-backend-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: bedrock-invoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: "*"

  BackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: openday-backend
      CodeUri: app/
      Handler: main.handler
      Role: !GetAtt BackendExecutionRole.Arn
      Layers: [!Ref DependenciesLayer]
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          DEMO_MODE: !Ref DemoMode
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref BackendHttpApi
            Path: /{proxy+}
            Method: ANY

  BackendHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: ["GET", "POST", "OPTIONS"]
        AllowHeaders: ["Content-Type"]

Outputs:
  ApiEndpoint:
    Description: Base URL for the backend API
    Value: !Sub "https://${BackendHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  FunctionName:
    Value: !Ref BackendFunction
